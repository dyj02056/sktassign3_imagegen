<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>짤·카드 스튜디오</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#0f1115;--panel:#1a1d24;--panel2:#232730;--border:#2e333d;
    --text:#e8eaed;--muted:#9aa0aa;--accent:#5b8cff;--accent2:#7c5cff;
    --danger:#ff5c5c;--ok:#4ade80;
  }
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic",
      "Apple SD Gothic Neo","Apple Color Emoji","Segoe UI Emoji",
      "Noto Color Emoji",sans-serif;
    background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;
  }
  header{
    display:flex;align-items:center;justify-content:space-between;
    padding:12px 20px;border-bottom:1px solid var(--border);
    background:var(--panel);position:sticky;top:0;z-index:100;
    flex-wrap:wrap;gap:8px;
  }
  header h1{
    font-size:18px;font-weight:700;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  header .sub{color:var(--muted);font-size:12px;margin-left:8px}
  .app{
    display:grid;grid-template-columns:340px 1fr 320px;gap:16px;
    padding:16px;min-height:calc(100vh - 57px);
  }
  @media(max-width:1100px){.app{grid-template-columns:1fr}}
  .panel{background:var(--panel);border:1px solid var(--border);
    border-radius:12px;padding:16px}
  .panel h2{
    font-size:13px;text-transform:uppercase;letter-spacing:.06em;
    color:var(--muted);margin-bottom:12px;font-weight:600;
  }
  .section{margin-bottom:20px}.section:last-child{margin-bottom:0}
  label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
  input[type=text],textarea,select{
    width:100%;background:var(--panel2);border:1px solid var(--border);
    color:var(--text);border-radius:8px;padding:8px 10px;font-size:13px;
    font-family:inherit;
  }
  textarea{resize:vertical;min-height:60px}
  input[type=color]{
    width:100%;height:36px;padding:2px;border-radius:8px;
    background:var(--panel2);border:1px solid var(--border);cursor:pointer;
  }
  input[type=range]{width:100%;accent-color:var(--accent)}
  .row{display:flex;gap:8px;align-items:center}.row>*{flex:1}
  .val{font-size:12px;color:var(--muted);text-align:right;min-width:44px}
  button{
    background:var(--panel2);border:1px solid var(--border);color:var(--text);
    border-radius:8px;padding:8px 12px;font-size:13px;cursor:pointer;
    font-family:inherit;transition:.15s;
  }
  button:hover{background:#2c313c}
  button.primary{
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    border:none;color:#fff;font-weight:600;
  }
  button.danger{color:var(--danger);border-color:#4a2a2a}
  button.block{width:100%}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{
    padding:6px 12px;border-radius:20px;font-size:12px;
    border:1px solid var(--border);background:var(--panel2);cursor:pointer;
  }
  .chip.active{background:var(--accent);border-color:var(--accent);color:#fff}
  .stage{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:#101217;border-radius:12px;border:1px solid var(--border);
    padding:20px;min-height:480px;overflow:auto;
  }
  .canvas-wrap{
    position:relative;box-shadow:0 10px 40px rgba(0,0,0,.5);
    background:#000;border-radius:4px;overflow:hidden;touch-action:none;
    max-width:100%;max-height:70vh;
    display:flex;align-items:center;justify-content:center;
  }
  #canvas{
    display:block;max-width:100%;max-height:70vh;
    width:auto;height:auto;object-fit:contain;
  }
  .canvas-wrap.grab{cursor:grab}.canvas-wrap.dragging{cursor:grabbing}
  .stage-info{
    margin-top:12px;font-size:12px;color:var(--muted);
    display:flex;gap:16px;flex-wrap:wrap;justify-content:center;
  }
  .stage-info b{color:var(--text)}
  .empty-hint{
    color:var(--muted);text-align:center;padding:40px;
    border:2px dashed var(--border);border-radius:12px;max-width:360px;
  }
  .tpl-list{
    display:flex;flex-direction:column;gap:8px;max-height:280px;overflow-y:auto;
  }
  .tpl-item{
    display:flex;align-items:center;justify-content:space-between;
    padding:8px 10px;border:1px solid var(--border);border-radius:8px;
    background:var(--panel2);gap:6px;flex-wrap:wrap;
  }
  .tpl-item .name{
    font-size:13px;flex:1;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;cursor:pointer;
  }
  .tpl-item input[type=text]{flex:1;min-width:80px;padding:4px 6px;font-size:12px}
  .tpl-item button{padding:4px 8px;font-size:11px}
  .toast{
    position:fixed;bottom:20px;left:50%;
    transform:translateX(-50%) translateY(20px);
    background:var(--panel2);border:1px solid var(--border);
    padding:12px 20px;border-radius:10px;font-size:13px;
    opacity:0;pointer-events:none;transition:.25s;z-index:1000;max-width:90vw;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast.error{border-color:var(--danger);color:#ffb4b4}
  .toast.ok{border-color:var(--ok);color:#b4ffcf}
  .field-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .field-grid .full{grid-column:1/-1}
  .badge{
    display:inline-block;font-size:10px;padding:2px 6px;border-radius:4px;
    background:var(--panel2);border:1px solid var(--border);color:var(--muted);
  }
  .hidden-file{display:none}
  .txt-pos-label{font-size:11px;color:var(--muted);margin-top:4px}
</style>
</head>
<body>
<header>
  <div><h1>짤·카드 스튜디오</h1><span class="sub">이미지 + 문구 → 밈·카드·SNS 이미지</span></div>
  <div class="row" style="flex:0 0 auto">
    <button id="btnExportJson">JSON 내보내기</button>
    <button id="btnImportJson">JSON 가져오기</button>
    <input type="file" id="fileImportJson" class="hidden-file" accept="application/json,.json">
    <button id="btnDownload" class="primary">이미지 다운로드</button>
  </div>
</header>

<div class="app">
  <aside class="panel">
    <div class="section">
      <h2>1. 이미지</h2>
      <input type="file" id="fileImage" accept="image/png,image/jpeg,image/webp" class="hidden-file">
      <button class="block primary" id="btnPickImage">PNG · JPEG 불러오기</button>
      <div class="txt-pos-label" id="imgInfo">이미지를 불러오세요 (드래그&드롭 가능)</div>
    </div>
    <div class="section">
      <h2>2. 문구</h2>
      <label for="txtContent">텍스트</label>
      <textarea id="txtContent">안녕하세요 😀</textarea>
      <div class="field-grid" style="margin-top:10px">
        <div class="full">
          <label>크기 <span class="badge" id="txtSizeVal">48</span></label>
          <input type="range" id="txtSize" min="4" max="400" value="48">
        </div>
        <div class="full">
          <label>색상</label>
          <input type="color" id="txtColor" value="#ffffff">
        </div>
        <div>
          <label>가로 <span class="badge" id="txtXVal">50%</span></label>
          <input type="range" id="txtX" min="-100" max="200" value="50">
        </div>
        <div>
          <label>세로 <span class="badge" id="txtYVal">50%</span></label>
          <input type="range" id="txtY" min="-100" max="200" value="50">
        </div>
        <div class="full">
          <label>정렬</label>
          <select id="txtAlign">
            <option value="center">가운데</option>
            <option value="left">왼쪽</option>
            <option value="right">오른쪽</option>
          </select>
        </div>
        <div class="full">
          <label>굵기</label>
          <select id="txtWeight">
            <option value="400">보통</option>
            <option value="700" selected>굵게</option>
            <option value="900">매우 굵게</option>
          </select>
        </div>
        <div class="full">
          <label>외곽선</label>
          <div class="row">
            <input type="color" id="txtStrokeColor" value="#000000">
            <input type="range" id="txtStroke" min="0" max="20" value="0">
            <span class="val" id="txtStrokeVal">0</span>
          </div>
        </div>
      </div>
    </div>
    <div class="section">
      <h2>3. 배경</h2>
      <label>배경색 (이미지 없을 때)</label>
      <input type="color" id="bgColor" value="#5b8cff">
    </div>
  </aside>

  <main class="stage" id="stage">
    <div class="empty-hint" id="emptyHint"><p>이미지를 불러오거나 문구를 입력하세요.</p></div>
    <div class="canvas-wrap grab" id="canvasWrap" style="display:none"><canvas id="canvas"></canvas></div>
    <div class="stage-info" id="stageInfo" style="display:none">
      <span>비율 <b id="infoRatio">1:1</b></span>
      <span>캔버스 <b id="infoSize">-</b></span>
    </div>
  </main>

  <aside class="panel">
    <div class="section">
      <h2>화면비</h2>
      <div class="chips" id="ratioChips">
        <div class="chip active" data-ratio="1:1">1:1</div>
        <div class="chip" data-ratio="4:5">4:5</div>
        <div class="chip" data-ratio="9:16">9:16</div>
      </div>
      <div class="txt-pos-label" id="ratioInfo">1:1 · 1080×1080</div>
    </div>
    <div class="section">
      <h2>템플릿</h2>
      <div class="row">
        <input type="text" id="tplName" placeholder="템플릿 이름">
        <button id="btnSaveTpl" class="primary" style="flex:0 0 auto">저장</button>
      </div>
      <div class="tpl-list" id="tplList" style="margin-top:10px"></div>
      <div class="txt-pos-label" id="tplCount">0개 저장됨 · 새로고침 후에도 유지</div>
      <div class="txt-pos-label" style="margin-top:6px">
        이름 더블클릭 = 이름 수정 · "덮어쓰기" = 현재 상태로 갱신
      </div>
    </div>
    <div class="section">
      <h2>내보내기</h2>
      <div class="row">
        <select id="exportFormat">
          <option value="image/png">PNG</option>
          <option value="image/jpeg">JPEG</option>
        </select>
        <button id="btnDownload2" class="primary" style="flex:0 0 auto">다운로드</button>
      </div>
      <div class="txt-pos-label">위치 메타데이터 미포함 저장</div>
    </div>
    <div class="section">
      <h2>샘플</h2>
      <button class="block" id="btnLoadSample1">샘플 ① 밈 카드</button>
      <button class="block" id="btnLoadSample2" style="margin-top:6px">샘플 ② SNS 카드</button>
      <button class="block" id="btnLoadSample3" style="margin-top:6px">샘플 ③ 세로 스토리</button>
    </div>
  </aside>
</div>

<div class="toast" id="toast"></div>

<script>
"use strict";

/* ============================================================
   상수
   ============================================================ */
const STORAGE_KEY = "jjalm-card-studio:templates:v1";
const FONT_FAMILY = '-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic",' +
  '"Apple SD Gothic Neo","Apple Color Emoji","Segoe UI Emoji",' +
  '"Noto Color Emoji",sans-serif';
const ACCEPTED = ["image/png", "image/jpeg", "image/jpg", "image/webp"];
const MAX_DIM = 2400;   // 로드 시 다운스케일 최대 변 (T03-C21, C28)

/* ============================================================
   상태
   ============================================================ */
const state = {
  ratio: "1:1",
  ratios: { "1:1":{w:1080,h:1080}, "4:5":{w:1080,h:1350}, "9:16":{w:1080,h:1920} },
  image: null,
  imageName: "",
  text: {
    content: "안녕하세요 😀",
    size: 48, color: "#ffffff", x: 50, y: 50,
    align: "center", weight: 700, stroke: 0, strokeColor: "#000000"
  },
  bgColor: "#5b8cff",
  templates: [],
  exportFormat: "image/png"
};
let downloadSeq = 0;

/* ============================================================
   DOM / 유틸
   ============================================================ */
const $ = id => document.getElementById(id);
const canvas = $("canvas");
const ctx = canvas.getContext("2d");
const canvasWrap = $("canvasWrap");
const stage = $("stage");
const emptyHint = $("emptyHint");
const stageInfo = $("stageInfo");

let toastTimer = null;
function toast(msg, type = "") {
  const el = $("toast");
  el.textContent = msg;
  el.className = "toast show " + type;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.className = "toast"; }, 2800);
}
function uid() {
  return "tpl_" + Date.now().toString(36) + "_" +
    Math.random().toString(36).slice(2, 7);
}

/* ============================================================
   캔버스 계산
   ============================================================ */
function getRatioDims() { return state.ratios[state.ratio]; }

function computeImageRect(iw, ih, dw, dh) {
  const s = Math.max(dw / iw, dh / ih);
  const w = iw * s, h = ih * s;
  return { x: (dw - w) / 2, y: (dh - h) / 2, w, h };
}

/* 컨텍스트 인자 방식 — 미리보기/저장 컨텍스트 분리 (T03-C11~13, C22) */
function wrapTextWith(c, text, maxWidth) {
  if (text === "") return [""];
  const lines = [];
  const paras = text.split("\n");
  for (const para of paras) {
    if (para === "") { lines.push(""); continue; }
    const words = para.split(/(\s+)/);
    let line = "";
    for (const tk of words) {
      if (tk === "") continue;
      const test = line + tk;
      if (c.measureText(test).width <= maxWidth || line === "") line = test;
      else { lines.push(line); line = tk.replace(/^\s+/, ""); }
    }
    lines.push(line);
  }
  return lines;
}

/* 텍스트 렌더 (미리보기/저장 공용) */
function drawTextOn(targetCtx, W, H) {
  const t = state.text;
  const fontSize = Math.max(1, t.size);
  targetCtx.font = `${t.weight} ${fontSize}px ${FONT_FAMILY}`;
  targetCtx.textBaseline = "middle";
  targetCtx.textAlign = t.align;
  targetCtx.fillStyle = t.color;

  const maxWidth = W * 0.9;
  const lines = wrapTextWith(targetCtx, t.content, maxWidth);
  const lineHeight = fontSize * 1.25;
  const totalH = lines.length * lineHeight;
  const cx = (t.x / 100) * W;
  const cy = (t.y / 100) * H;
  const startY = cy - totalH / 2 + lineHeight / 2;

  for (let i = 0; i < lines.length; i++) {
    const y = startY + i * lineHeight;
    const line = lines[i] || " ";
    if (t.stroke > 0) {
      targetCtx.lineJoin = "round";
      targetCtx.lineWidth = t.stroke;
      targetCtx.strokeStyle = t.strokeColor;
      targetCtx.strokeText(line, cx, y, maxWidth);
    }
    targetCtx.fillText(line, cx, y, maxWidth);
  }
  return lines;
}

/* ============================================================
   렌더
   ============================================================ */
function render() {
  const { w: W, h: H } = getRatioDims();
  canvas.width = W; canvas.height = H;
  ctx.clearRect(0, 0, W, H);
  if (state.image) {
    const r = computeImageRect(
      state.image.naturalWidth, state.image.naturalHeight, W, H);
    try { ctx.drawImage(state.image, r.x, r.y, r.w, r.h); }
    catch (e) { ctx.fillStyle = state.bgColor; ctx.fillRect(0, 0, W, H); }
  } else {
    ctx.fillStyle = state.bgColor; ctx.fillRect(0, 0, W, H);
  }
  drawTextOn(ctx, W, H);
  $("infoRatio").textContent = state.ratio;
  $("infoSize").textContent = `${W}×${H}`;
}
function showCanvas() {
  emptyHint.style.display = "none";
  canvasWrap.style.display = "flex";
  stageInfo.style.display = "flex";
}

/* ============================================================
   이미지 로드 (다운스케일 + 메타 제거)
   ============================================================ */
function handleImageFile(file) {
  if (!file) return;
  if (!ACCEPTED.includes(file.type)) {
    toast(`지원하지 않는 형식: ${file.type || "알 수 없음"} (PNG·JPEG·WebP만)`,
      "error");
    $("imgInfo").textContent = "❌ 지원하지 않는 파일 (기존 작업 유지)";
    $("imgInfo").title = file.name;
    return;  // 기존 작업 유지 (T03-C09)
  }
  const reader = new FileReader();
  reader.onload = e => {
    const raw = new Image();
    raw.onload = () => {
      let w = raw.naturalWidth, h = raw.naturalHeight;
      const s = Math.min(1, MAX_DIM / Math.max(w, h));
      if (s < 1) { w = Math.round(w * s); h = Math.round(h * s); }
      const off = document.createElement("canvas");
      off.width = w; off.height = h;
      off.getContext("2d").drawImage(raw, 0, 0, w, h);
      const scaled = new Image();
      scaled.onload = () => {
        state.image = scaled;
        state.imageName = file.name;
        $("imgInfo").textContent = `✅ 이미지 로드됨 (${w}×${h})`;
        $("imgInfo").title = file.name;
        render(); showCanvas();
      };
      scaled.src = off.toDataURL("image/png");
    };
    raw.onerror = () => toast("이미지 데이터를 읽을 수 없습니다.", "error");
    raw.src = e.target.result;
  };
  reader.onerror = () => toast("파일 읽기 오류", "error");
  reader.readAsDataURL(file);
}

/* ============================================================
   화면비
   ============================================================ */
function setRatio(r) {
  if (!state.ratios[r]) return;
  state.ratio = r;
  document.querySelectorAll("#ratioChips .chip")
    .forEach(c => c.classList.toggle("active", c.dataset.ratio === r));
  const d = state.ratios[r];
  $("ratioInfo").textContent = `${r} · ${d.w}×${d.h}`;
  render();
}

/* ============================================================
   다운로드
   ============================================================ */
function downloadImage() {
  const { w: W, h: H } = getRatioDims();
  const off = document.createElement("canvas");
  off.width = W; off.height = H;
  const octx = off.getContext("2d");

  if (state.image) {
    const r = computeImageRect(
      state.image.naturalWidth, state.image.naturalHeight, W, H);
    octx.drawImage(state.image, r.x, r.y, r.w, r.h);
  } else {
    octx.fillStyle = state.bgColor; octx.fillRect(0, 0, W, H);
  }
  drawTextOn(octx, W, H);   // 동일 로직, 저장 컨텍스트로 측정

  const mime = state.exportFormat;
  const ext = mime === "image/jpeg" ? "jpg" : "png";
  const url = off.toDataURL(mime, 0.95);
  downloadSeq++;
  const rnd = Math.random().toString(36).slice(2, 6);
  const a = document.createElement("a");
  a.href = url;
  a.download = `jjalm-card_${state.ratio.replace(":", "x")}_` +
    `${Date.now()}_${downloadSeq}_${rnd}.${ext}`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  toast("다운로드 완료", "ok");
}

/* ============================================================
   템플릿 CRUD
   ============================================================ */
function loadTemplates() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    state.templates = raw ? JSON.parse(raw) : [];
  } catch (e) { state.templates = []; }
}
function persistTemplates() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state.templates)); }
  catch (e) { toast("저장 실패 (용량 초과?)", "error"); }
}
function renderTemplates() {
  const list = $("tplList"); list.innerHTML = "";
  state.templates.forEach(t => {
    const div = document.createElement("div");
    div.className = "tpl-item";

    // 이름 (더블클릭 인라인 편집) — T03-C19(카드4)
    const nameEl = document.createElement("span");
    nameEl.className = "name";
    nameEl.textContent = t.name;
    nameEl.title = "더블클릭하여 이름 수정";
    nameEl.ondblclick = () => {
      const input = document.createElement("input");
      input.type = "text"; input.value = t.name;
      const commit = () => {
        const v = input.value.trim() || t.name;
        t.name = v; persistTemplates(); renderTemplates();
        toast("이름 수정됨", "ok");
      };
      input.onblur = commit;
      input.onkeydown = ev => {
        if (ev.key === "Enter") commit();
        if (ev.key === "Escape") renderTemplates();
      };
      div.replaceChild(input, nameEl);
      input.focus(); input.select();
    };

    // 덮어쓰기 — 현재 상태로 갱신
    const btnOverwrite = document.createElement("button");
    btnOverwrite.textContent = "덮어쓰기";
    btnOverwrite.title = "현재 상태로 이 템플릿을 덮어씁니다";
    btnOverwrite.onclick = () => {
      t.ratio = state.ratio;
      t.text = JSON.parse(JSON.stringify(state.text));
      t.bgColor = state.bgColor;
      t.imageData = state.image ? canvas.toDataURL("image/png") : null;
      persistTemplates(); renderTemplates();
      toast(`"${t.name}" 덮어씀`, "ok");
    };

    // 불러오기
    const btnLoad = document.createElement("button");
    btnLoad.textContent = "불러오기";
    btnLoad.onclick = () => applyTemplate(t);

    // 삭제
    const btnDel = document.createElement("button");
    btnDel.textContent = "삭제"; btnDel.className = "danger";
    btnDel.onclick = () => {
      state.templates = state.templates.filter(x => x.id !== t.id);
      persistTemplates(); renderTemplates();
      toast("삭제됨", "ok");
    };

    div.appendChild(nameEl);
    div.appendChild(btnOverwrite);
    div.appendChild(btnLoad);
    div.appendChild(btnDel);
    list.appendChild(div);
  });
  $("tplCount").textContent =
    `${state.templates.length}개 저장됨 · 새로고침 후에도 유지`;
}
function saveTemplate() {
  const name = $("tplName").value.trim();
  if (!name) { toast("템플릿 이름을 입력하세요", "error"); return; }
  const tpl = {
    id: uid(), name,
    ratio: state.ratio,
    text: JSON.parse(JSON.stringify(state.text)),
    bgColor: state.bgColor,
    imageData: state.image ? canvas.toDataURL("image/png") : null
  };
  state.templates.push(tpl);
  persistTemplates(); renderTemplates();
  $("tplName").value = "";
  toast(`템플릿 "${name}" 저장됨`, "ok");
}
function applyTemplate(t) {
  state.ratio = t.ratio; setRatio(t.ratio);
  state.text = JSON.parse(JSON.stringify(t.text));
  state.bgColor = t.bgColor;

  // 컨트롤 동기화
  $("txtContent").value = state.text.content;
  $("txtSize").value = state.text.size;
  $("txtSizeVal").textContent = state.text.size;
  $("txtColor").value = state.text.color;
  $("txtX").value = state.text.x;
  $("txtXVal").textContent = state.text.x + "%";
  $("txtY").value = state.text.y;
  $("txtYVal").textContent = state.text.y + "%";
  $("txtAlign").value = state.text.align;
  $("txtWeight").value = state.text.weight;
  $("txtStroke").value = state.text.stroke;
  $("txtStrokeVal").textContent = state.text.stroke;
  $("txtStrokeColor").value = state.text.strokeColor;
  $("bgColor").value = state.bgColor;

  if (t.imageData) {
    const img = new Image();
    img.onload = () => { state.image = img; showCanvas(); render(); };
    img.src = t.imageData;
  } else {
    state.image = null; render(); showCanvas();
  }
  toast(`템플릿 "${t.name}" 불러옴`, "ok");
}

/* ============================================================
   JSON 내보내기 / 가져오기
   ============================================================ */
function exportJson() {
  const payload = {
    version: 1, exportedAt: new Date().toISOString(),
    templates: state.templates
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)],
    { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `jjalm-templates_${Date.now()}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  toast("JSON 내보내기 완료", "ok");
}
function importJsonFile(file) {
  const reader = new FileReader();
  reader.onload = e => {
    let data;
    try { data = JSON.parse(e.target.result); }
    catch (err) {
      toast("JSON 문법 오류 — 기존 템플릿 유지", "error");
      return;  // T03-C23: 저장 전 거부
    }
    if (!data || typeof data !== "object" || !Array.isArray(data.templates)) {
      toast("필수 항목(templates) 누락 — 기존 템플릿 유지", "error");
      return;  // T03-C24
    }
    const before = state.templates.length;
    const valid = data.templates.filter(t =>
      t && typeof t.name === "string" &&
      t.text && typeof t.text.content === "string");
    if (valid.length !== data.templates.length) {
      toast("일부 항목이 손상되어 제외됨", "error");
    }
    // id 충돌 시 새 uid 발급 (기존 유지)
    const idSet = new Set(state.templates.map(t => t.id));
    for (const t of valid) {
      if (!t.id || idSet.has(t.id)) t.id = uid();
      idSet.add(t.id);
      state.templates.push(t);
    }
    persistTemplates(); renderTemplates();
    toast(`JSON 가져오기 완료 (${before} → ${state.templates.length})`, "ok");
  };
  reader.onerror = () => toast("파일 읽기 오류", "error");
  reader.readAsText(file);
}

/* ============================================================
   샘플
   ============================================================ */

  const samples = {
    1: { ratio: "1:1", bgColor: "#222",
         text: { content: "오늘도\n출근 완료 😎", size: 90, color: "#fff",
                 x: 50, y: 50, align: "center", weight: 900,
                 stroke: 6, strokeColor: "#000" } },
    2: { ratio: "4:5", bgColor: "#5b8cff",
         text: { content: "SNS 카드\n새 소식이 도착했어요 ✨", size: 70,
                 color: "#fff", x: 50, y: 40, align: "center", weight: 700,
                 stroke: 0, strokeColor: "#000" } },
    3: { ratio: "9:16", bgColor: "#7c5cff",
         text: { content: "세로 스토리\n오늘의 한 컷", size: 80, color: "#fff",
                 x: 50, y: 80, align: "center", weight: 900,

  const s = samples[n]; if (!s) return;

  $("txtContent").value = state.text.content;
  $("txtSize").value = state.text.size;
  $("txtSizeVal").textContent = state.text.size;
  $("txtColor").value = state.text.color;
  $("txtX").value = state.text.x;
  $("txtXVal").textContent = state.text.x + "%";
  $("txtY").value = state.text.y;
  $("txtYVal").textContent = state.text.y + "%";
  $("txtAlign").value = state.text.align;
  $("txtWeight").value = state.text.weight;
  $("txtStroke").value = state.text.stroke;
  $("txtStrokeVal").textContent = state.text.stroke;
  $("txtStrokeColor").value = state.text.strokeColor;

  render(); showCanvas();
  toast(`샘플 ${n} 불러옴`, "ok");
}

/* ============================================================
   캔버스 드래그
   ============================================================ */
function bindDrag() {
  let dragging = false;
  const getPos = e => {
    const r = canvas.getBoundingClientRect();
    const cx = e.touches ? e.touches[0].clientX : e.clientX;
    const cy = e.touches ? e.touches[0].clientY : e.clientY;
    return { x: ((cx - r.left) / r.width) * 100,
             y: ((cy - r.top) / r.height) * 100 };
  };
  const start = e => {
    dragging = true;
    canvasWrap.classList.add("dragging");
    canvasWrap.classList.remove("grab");
    e.preventDefault();
  };
  const move = e => {
    if (!dragging) return;
    const p = getPos(e);
    state.text.x = Math.round(Math.max(-100, Math.min(200, p.x)));
    state.text.y = Math.round(Math.max(-100, Math.min(200, p.y)));
    $("txtX").value = state.text.x;
    $("txtY").value = state.text.y;
    $("txtXVal").textContent = state.text.x + "%";
    $("txtYVal").textContent = state.text.y + "%";
    render();
    e.preventDefault();
  };
  const end = () => {
    dragging = false;
    canvasWrap.classList.remove("dragging");
    canvasWrap.classList.add("grab");
  };
  canvasWrap.addEventListener("mousedown", start);
  window.addEventListener("mousemove", move);
  window.addEventListener("mouseup", end);
  canvasWrap.addEventListener("touchstart", start, { passive: false });
  window.addEventListener("touchmove", move, { passive: false });
  window.addEventListener("touchend", end);
}

/* ============================================================
   이벤트 바인딩
   ============================================================ */
function bind() {
  $("btnPickImage").onclick = () => $("fileImage").click();
  $("fileImage").onchange = e => {
    if (e.target.files[0]) handleImageFile(e.target.files[0]);
    e.target.value = "";
  };
  stage.addEventListener("dragover", e => e.preventDefault());
  stage.addEventListener("drop", e => {
    e.preventDefault();
    if (e.dataTransfer.files[0]) handleImageFile(e.dataTransfer.files[0]);
  });

  $("txtContent").oninput = e => {
    state.text.content = e.target.value; render(); showCanvas();
  };
  $("txtSize").oninput = e => {
    state.text.size = +e.target.value;
    $("txtSizeVal").textContent = e.target.value; render();
  };
  $("txtColor").oninput = e => {
    state.text.color = e.target.value; render();
  };
  $("txtX").oninput = e => {
    state.text.x = +e.target.value;
    $("txtXVal").textContent = e.target.value + "%"; render();
  };
  $("txtY").oninput = e => {
    state.text.y = +e.target.value;
    $("txtYVal").textContent = e.target.value + "%"; render();
  };
  $("txtAlign").onchange = e => {
    state.text.align = e.target.value; render();
  };
  $("txtWeight").onchange = e => {
    state.text.weight = +e.target.value; render();
  };
  $("txtStroke").oninput = e => {
    state.text.stroke = +e.target.value;
    $("txtStrokeVal").textContent = e.target.value; render();
  };
  $("txtStrokeColor").oninput = e => {
    state.text.strokeColor = e.target.value; render();
  };
  $("bgColor").oninput = e => {
    state.bgColor = e.target.value; render();
  };

  document.querySelectorAll("#ratioChips .chip")
    .forEach(c => c.onclick = () => setRatio(c.dataset.ratio));

  $("btnDownload").onclick = downloadImage;
  $("btnDownload2").onclick = downloadImage;
  $("exportFormat").onchange = e => state.exportFormat = e.target.value;

  $("btnSaveTpl").onclick = saveTemplate;

  $("btnExportJson").onclick = exportJson;
  $("btnImportJson").onclick = () => $("fileImportJson").click();
  $("fileImportJson").onchange = e => {
    if (e.target.files[0]) importJsonFile(e.target.files[0]);
    e.target.value = "";
  };

  $("btnLoadSample1").onclick = () => loadSample(1);
  $("btnLoadSample2").onclick = () => loadSample(2);
  $("btnLoadSample3").onclick = () => loadSample(3);

  bindDrag();
  let rt = null;
  window.addEventListener("resize", () => {
    clearTimeout(rt); rt = setTimeout(render, 100);
  });
}

/* ============================================================
   초기화
   ============================================================ */
function init() {
  loadTemplates();
  renderTemplates();
  bind();
  render();
  showCanvas();
}
init();
</script>
